<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="書庫底下分成 notes 與 slides 兩個渠道，同名主題自動配對">
  <style>
    text { font-family: sans-serif; fill: #2b2b2b; }
    .s { font-size: 15px; fill: #6b6b6b; }
  </style>
  <rect x="220" y="20" width="200" height="56" rx="10" fill="#f4efe6" stroke="#8a8178" stroke-width="2"/>
  <text x="320" y="55" text-anchor="middle" font-size="20" font-weight="700">我的頁堆/</text>
  <path d="M320 76 V110 H150 V140 M320 110 H490 V140" fill="none" stroke="#8a8178" stroke-width="2"/>
  <rect x="40" y="140" width="220" height="64" rx="10" fill="#e8eef6" stroke="#4f73a6" stroke-width="2"/>
  <text x="150" y="170" text-anchor="middle" font-size="20" font-weight="700">notes/</text>
  <text x="150" y="192" text-anchor="middle" class="s">筆記渠道</text>
  <rect x="380" y="140" width="220" height="64" rx="10" fill="#f6ece8" stroke="#c0674a" stroke-width="2"/>
  <text x="490" y="170" text-anchor="middle" font-size="20" font-weight="700">slides/</text>
  <text x="490" y="192" text-anchor="middle" class="s">簡報渠道</text>
  <rect x="60" y="250" width="180" height="48" rx="8" fill="none" stroke="#4f73a6" stroke-width="2"/>
  <text x="150" y="280" text-anchor="middle" font-size="17">10-reading/</text>
  <rect x="400" y="250" width="180" height="48" rx="8" fill="none" stroke="#c0674a" stroke-width="2"/>
  <text x="490" y="280" text-anchor="middle" font-size="17">10-reading/</text>
  <path d="M150 204 V250 M490 204 V250" fill="none" stroke="#8a8178" stroke-width="2"/>
  <path d="M240 274 H400" fill="none" stroke="#5f8a64" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="320" y="262" text-anchor="middle" font-size="15" fill="#5f8a64">同名 = 同一主題</text>
  <text x="320" y="350" text-anchor="middle" class="s">筆記與簡報各自存放，用連結與一次性轉換接起來</text>
</svg>
