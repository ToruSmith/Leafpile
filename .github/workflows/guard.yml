name: 守門檢查

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 1 * * 1'   # 每週一提醒到期的急件（台北時間 09:17）

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 單元測試
        run: node --test tests/*.test.mjs
      - name: content/ 守門（檔案大小、路徑、公開、急件、個資）
        run: node scripts/guard-content.mjs content
